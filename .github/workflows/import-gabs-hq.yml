name: Import Gabs HQ assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-gabs-hq.yml'
      - '.github/scripts/import-gabs-hq.sh'

permissions:
  contents: write

jobs:
  import-hq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import and verify HQ photography
        run: bash .github/scripts/import-gabs-hq.sh
