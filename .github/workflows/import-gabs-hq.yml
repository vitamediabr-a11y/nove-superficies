name: Import Gabs HQ assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-gabs-hq.yml'
      - '.github/scripts/import-gabs-hq.sh'

permissions:
  contents: write

jobs:
  import-hq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use public Drive direct-download endpoint
        run: |
          sed -i 's#https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t#https://drive.google.com/uc?export=download\&id=${id}#' .github/scripts/import-gabs-hq.sh

      - name: Import and verify HQ photography
        run: bash .github/scripts/import-gabs-hq.sh
